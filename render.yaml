services:
  - type: web
    name: split-and-pay
    runtime: node
    plan: free
    buildCommand: rm -rf .next && npm ci && npm run build
    startCommand: npm start -- --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: PAYPAL_BN_CODE
        sync: false
